name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build and unit test
        run: mvn -B -ntp clean verify

  platform-app-smoke:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Platform app context smoke test (ci profile)
        run: mvn -B -ntp -pl platform-app -am -Dspring.profiles.active=ci -Dtest=PlatformApplicationSmokeTest -Dsurefire.failIfNoSpecifiedTests=false test
